[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dpdp-auditor"
version = "0.1.0"
description = "DPDP Compliance Auditor: maps Personal Data mishandling in a Target Application to the DPDP Act 2023 and Rules 2025"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "cvss>=3.2",
    "semgrep>=1.180",
    "python-hcl2>=8.2.0",
    "weasyprint>=70",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dpdp-audit = "auditor.cli:main"

[tool.setuptools.packages.find]
include = ["auditor*", "dashboard*"]

[tool.setuptools.package-data]
auditor = ["schema/*.json", "registry/*.yaml", "remediation/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
