http {
  log_format main '$remote_addr $status $body_bytes_sent';
  access_log /var/log/nginx/access.log main;
  upstream backend {
    server api:3000;
  }
  server {
    listen 443 ssl;
    server_name app.example.com;
    ssl_certificate /etc/ssl/app.pem;
    location /api/ {

      proxy_pass http://backend;
    }
    location /static/ {
      root /srv/static;
    }
  }
}
