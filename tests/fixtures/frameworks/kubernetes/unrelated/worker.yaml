apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: example/worker:1.0
          ports:
            - containerPort: 9000
          securityContext:
            privileged: true
---
apiVersion: v1
kind: Service
metadata:
  name: worker
spec:
  type: LoadBalancer
  selector:
    app: worker
  ports:
    - port: 9000
