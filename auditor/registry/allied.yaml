- id: Aadhaar-Act-29
  instrument: Aadhaar Act 2016
  kind: allied
  citation: "Section 29"
  title: "Restriction on sharing information"
  excerpt: "29. (1) No core biometric information, collected or created under this Act, shall be— (a) shared with anyone for any reason whatsoever; or (b) used for any purpose other than generation of Aadhaar numbers and authentication under this Act. … (4) No Aadhaar number or core biometric information collected or created under this Act in respect of an Aadhaar number holder shall be published, displayed or posted publicly, except for the purposes as may be specified by regulations."
