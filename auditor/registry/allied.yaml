- id: OWASP-API1-2023
  instrument: OWASP
  kind: owasp
  citation: "API1:2023"
  title: "Broken Object Level Authorization"
  excerpt: "Every API endpoint that receives an ID of an object, and performs any action on the object, should implement object-level authorization checks. The checks should validate that the logged-in user has permissions to perform the requested action on the requested object."
