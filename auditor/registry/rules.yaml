- id: DPDP-Rule-1
  instrument: DPDP Rules 2025
  kind: dpdp-rule
  citation: "Rule 1"
  title: "Short title and commencement"
  excerpt: "(1) These rules may be called the Digital Personal Data Protection Rules, 2025. (2) Rules 1, 2 and 17 to 21 shall come into force on the date of their publication in the Official Gazette. (3) Rule 4 shall come into force one year after the date of publication of this Gazette. (4) Rules 3, 5 to 16, 22 and 23 shall come into force eighteen months after the date of publication of this Gazette."
