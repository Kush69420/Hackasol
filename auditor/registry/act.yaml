# DPDP Act 2023 (Digital Personal Data Protection Act, 2023; 22 of 2023): one entry per section, sub-section and cited clause, plus the penalty Schedule.
# Excerpts: copied from the official text at indiacode.gov.in (fetched); elisions marked " … "; each kept at 500 characters or fewer.
# Commencement: G.S.R. 843(E), Gazette notice dated 13 Nov 2025 (Gazette header). Basis used: publication 14 Nov 2025 (repo basis, docs/issue-types.md).
#   cl.(a) publication (14 Nov 2025): s.1(2), s.2, ss.18-26, s.35, ss.38-43, s.44(1) and (3).
#   cl.(b) one year (14 Nov 2026): s.6(9), s.27(1)(d).
#   cl.(c) eighteen months (14 May 2027): ss.3-5, s.6(1)-(8) and (10), ss.7-10, ss.11-17, s.27 except (1)(d), ss.28-34, ss.36-37, s.44(2).
#   s.1(1) is not named in the notice; it takes effect with s.1(2) (inference).
#   The Act's own footnote lists "Ss. 35 to 43" at publication; the notice places ss.36-37 at eighteen months and is followed.
# Penalty ceilings (INR crore): s.8(5) 250; s.8(6) 200; s.9 and sub-units 200; s.10 and sub-units 150; s.15 null (Schedule item 5: ten thousand rupees); every other provision 50 via DPDP-Act-Schedule-7. Schedule item 6 has no fixed figure (null).

- id: DPDP-Act-1
  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 1"
  title: "Short title and commencement"
  excerpt: "(1) This Act may be called the Digital Personal Data Protection Act, 2023. (2) It shall come into force on such date as the Central Government may, by notification in the Official Gazette, appoint and different dates may be appointed for different provisions of this Act and any reference in any such provision to the commencement of this Act shall be construed as a reference to the coming into force of that provision."
