- id: DPDP-Act-9(5)
  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 9(5)"
  title: "Age-based exemption by notification"
  excerpt: "(5) The Central Government may, if satisfied that a Data Fiduciary has ensured that its processing of personal data of children is done in a manner that is verifiably safe, notify for such processing by such Data Fiduciary the age above which that Data Fiduciary shall be exempt from the applicability of all or any of the obligations under sub-sections (1) and (3) in respect of processing by that Data Fiduciary as the notification may specify."
  parent: DPDP-Act-9
  penalty_parent: DPDP-Act-9
