- id: DPDP-Act-10
  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 10"
  title: "Additional obligations of Significant Data Fiduciary"
  excerpt: "(1) The Central Government may notify any Data Fiduciary or class of Data Fiduciaries as Significant Data Fiduciary, on the basis of an assessment of such relevant factors as it may determine, including— (a) the volume and sensitivity of personal data processed; (b) risk to the rights of Data Principal; (c) potential impact on the sovereignty and integrity of India; (d) risk to electoral democracy; (e) security of the State; and (f) public order."
