  verified: true

- id: DPDP-Act-9
  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 9"
  title: "Processing of personal data of children"
  excerpt: "(1) The Data Fiduciary shall, before processing any personal data of a child or a person with disability who has a lawful guardian obtain verifiable consent of the parent of such child or the lawful guardian, as the case may be, in such manner as may be prescribed. Explanation.—For the purpose of this sub-section, the expression “consent of the parent” includes the consent of lawful guardian, wherever applicable."
  parent: null
  penalty_parent: DPDP-Act-9
  penalty_ceiling_inr_crore: 200
  enforceable_from: 2027-05-14
  enforceable_basis: "G.S.R. 843(E) cl.(c): eighteen months after publication, 14 May 2027"
  source: {document: "Digital Personal Data Protection Act, 2023 (22 of 2023)", url: "https://indiacode.gov.in/server/api/core/bitstreams/52f9ecbb-b927-4ba6-ae6f-ca2fac50d4df/content"}
  verified: true

