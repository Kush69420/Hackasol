- id: DPDP-Act-8(2)
  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 8(2)"
  title: "Engagement of Data Processor"
  excerpt: "(2) A Data Fiduciary may engage, appoint, use or otherwise involve a Data Processor to process personal data on its behalf for any activity related to offering of goods or services to Data Principals only under a valid contract."
