- id: DPDP-Act-5
  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 5"
  title: "Notice"
  excerpt: "(1) Every request made to a Data Principal under section 6 for consent shall be accompanied or preceded by a notice given by the Data Fiduciary to the Data Principal, informing her,— (i) the personal data and the purpose for which the same is proposed to be processed; (ii) the manner in which she may exercise her rights under sub-section (4) of section 6 and section 13; and (iii) the manner in which the Data Principal may make a complaint to the Board, in such manner and as may be prescribed."
  parent: null
  penalty_parent: DPDP-Act-Schedule-7
  penalty_ceiling_inr_crore: 50
