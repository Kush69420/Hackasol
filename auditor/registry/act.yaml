  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 28(7)"
  title: "Civil court powers of Board"
  excerpt: "(7) For the purposes of discharging its functions under this Act, the Board shall have the same powers as are vested in a civil court under the Code of Civil Procedure, 1908 (5 of 1908), in respect of matters relating to— (a) summoning and enforcing the attendance of any person and examining her on oath; … (d) such other matters as may be prescribed."
