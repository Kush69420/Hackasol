- id: DPDP-Act-5(2)
  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 5(2)"
  title: "Notice for consent given before commencement"
  excerpt: "(2) Where a Data Principal has given her consent for the processing of her personal data before the date of commencement of this Act,— (a) the Data Fiduciary shall, as soon as it is reasonably practicable, give to the Data Principal a notice informing her,— … (b) the Data Fiduciary may continue to process the personal data until and unless the Data Principal withdraws her consent."
  parent: DPDP-Act-5
  penalty_parent: DPDP-Act-Schedule-7
  penalty_ceiling_inr_crore: 50
  enforceable_from: 2027-05-14
  enforceable_basis: "G.S.R. 843(E) cl.(c): eighteen months after publication, 14 May 2027"
  source: {document: "Digital Personal Data Protection Act, 2023 (22 of 2023)", url: "https://indiacode.gov.in/server/api/core/bitstreams/52f9ecbb-b927-4ba6-ae6f-ca2fac50d4df/content"}
  verified: true

