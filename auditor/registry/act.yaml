  citation: "Section 29(6)"
  title: "Expeditious disposal of appeal within six months"
  excerpt: "(6) The appeal filed before the Appellate Tribunal under sub-section (1) shall be dealt with by it as expeditiously as possible and endeavour shall be made by it to dispose of the appeal finally within six months from the date on which the appeal is presented to it."
