  kind: dpdp-act
  citation: "Section 28(10)"
  title: "Interim orders"
  excerpt: "(10) During the course of the inquiry, if the Board considers it necessary, it may for reasons to be recorded in writing, issue interim orders after giving the person concerned an opportunity of being heard."
