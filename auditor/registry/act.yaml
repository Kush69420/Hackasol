- id: DPDP-Act-39
  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 39"
  title: "Bar of jurisdiction"
  excerpt: "No civil court shall have the jurisdiction to entertain any suit or proceeding in respect of any matter for which the Board is empowered under the provisions of this Act and no injunction shall be granted by any court or other authority in respect of any action taken or to be taken in pursuance of any power under the provisions of this Act."
