- id: DPDP-Act-8(3)
  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 8(3)"
  title: "Completeness, accuracy and consistency"
  excerpt: "(3) Where personal data processed by a Data Fiduciary is likely to be— (a) used to make a decision that affects the Data Principal; or (b) disclosed to another Data Fiduciary, the Data Fiduciary processing such personal data shall ensure its completeness, accuracy and consistency."
