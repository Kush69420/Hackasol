  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 8(6)"
  title: "Notice of personal data breach"
  excerpt: "(6) In the event of a personal data breach, the Data Fiduciary shall give the Board and each affected Data Principal, intimation of such breach in such form and manner as may be prescribed."
  parent: DPDP-Act-8
  penalty_parent: DPDP-Act-8(6)
