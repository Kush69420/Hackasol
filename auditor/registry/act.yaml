- id: DPDP-Act-8(8)
  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 8(8)"
  title: "Deemed lapse of specified purpose"
  excerpt: "(8) The purpose referred to in clause (a) of sub-section (7) shall be deemed to no longer be served, if the Data Principal does not— (a) approach the Data Fiduciary for the performance of the specified purpose; and (b) exercise any of her rights in relation to such processing, for such time period as may be prescribed, and different time periods may be prescribed for different classes of Data Fiduciaries and for different purposes."
  parent: DPDP-Act-8
