  verified: true

- id: DPDP-Act-6
  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 6"
  title: "Consent"
  excerpt: "(1) The consent given by the Data Principal shall be free, specific, informed, unconditional and unambiguous with a clear affirmative action, and shall signify an agreement to the processing of her personal data for the specified purpose and be limited to such personal data as is necessary for such specified purpose."
  parent: null
  penalty_parent: DPDP-Act-Schedule-7
