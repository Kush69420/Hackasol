- id: DPDP-Act-3
  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 3"
  title: "Application of Act"
  excerpt: "Subject to the provisions of this Act, it shall— (a) apply to the processing of digital personal data within the territory of India where the personal data is collected— (i) in digital form; or (ii) in non-digital form and digitised subsequently; (b) also apply to processing of digital personal data outside the territory of India, if such processing is in connection with any activity related to offering of goods or services to Data Principals within the territory of India; …"
  parent: null
  penalty_parent: DPDP-Act-Schedule-7
  penalty_ceiling_inr_crore: 50
  enforceable_from: 2027-05-14
  enforceable_basis: "G.S.R. 843(E) cl.(c): eighteen months after publication, 14 May 2027"
  source: {document: "Digital Personal Data Protection Act, 2023 (22 of 2023)", url: "https://indiacode.gov.in/server/api/core/bitstreams/52f9ecbb-b927-4ba6-ae6f-ca2fac50d4df/content"}
  verified: true

- id: DPDP-Act-4
  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 4"
  title: "Grounds for processing personal data"
  excerpt: "(1) A person may process the personal data of a Data Principal only in accordance with the provisions of this Act and for a lawful purpose,— (a) for which the Data Principal has given her consent; or (b) for certain legitimate uses. (2) For the purposes of this section, the expression “lawful purpose” means any purpose which is not expressly forbidden by law."
  parent: null
  penalty_parent: DPDP-Act-Schedule-7
  penalty_ceiling_inr_crore: 50
  enforceable_from: 2027-05-14
  enforceable_basis: "G.S.R. 843(E) cl.(c): eighteen months after publication, 14 May 2027"
