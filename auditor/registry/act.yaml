  kind: dpdp-act
  citation: "Section 27(3)"
  title: "Modification, suspension, withdrawal or cancellation of directions"
  excerpt: "(3) The Board may, on a representation made to it by a person affected by a direction issued under sub-section (1) or sub-section (2), or on a reference made by the Central Government, modify, suspend, withdraw or cancel such direction and, while doing so, impose such conditions as it may deem fit, subject to which the modification, suspension, withdrawal or cancellation shall have effect."
