  kind: dpdp-act
  citation: "Section 29(3)"
  title: "Condonation of delay in appeal"
  excerpt: "(3) The Appellate Tribunal may entertain an appeal after the expiry of the period specified in subsection (2), if it is satisfied that there was sufficient cause for not preferring the appeal within that period."
