  kind: dpdp-act
  citation: "Section 25"
  title: "Members and officers to be public servants"
  excerpt: "The Chairperson, Members, officers and employees of the Board shall be deemed, when acting or purporting to act in pursuance of provisions of this Act, to be public servants within the meaning of section 21 of the Indian Penal Code (45 of 1860)."
