- id: DPDP-Act-9(4)
  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 9(4)"
  title: "Exempt classes and purposes"
  excerpt: "(4) The provisions of sub-sections (1) and (3) shall not be applicable to processing of personal data of a child by such classes of Data Fiduciaries or for such purposes, and subject to such conditions, as may be prescribed."
  parent: DPDP-Act-9
