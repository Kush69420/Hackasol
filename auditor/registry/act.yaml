  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 6(9)"
  title: "Registration of Consent Manager"
  excerpt: "(9) Every Consent Manager shall be registered with the Board in such manner and subject to such technical, operational, financial and other conditions as may be prescribed."
