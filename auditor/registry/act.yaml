  kind: dpdp-act
  citation: "Section 28(8)"
  title: "No prevention of access or custody of equipment"
  excerpt: "(8) The Board or its officers shall not prevent access to any premises or take into custody any equipment or any item that may adversely affect the day-to-day functioning of a person."
