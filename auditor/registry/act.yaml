  verified: true

- id: DPDP-Act-7
  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 7"
  title: "Certain legitimate uses"
  excerpt: "A Data Fiduciary may process personal data of a Data Principal for any of following uses, namely:— (a) for the specified purpose for which the Data Principal has voluntarily provided her personal data to the Data Fiduciary, and in respect of which she has not indicated to the Data Fiduciary that she does not consent to the use of her personal data."
  parent: null
  penalty_parent: DPDP-Act-Schedule-7
  penalty_ceiling_inr_crore: 50
  enforceable_from: 2027-05-14
  enforceable_basis: "G.S.R. 843(E) cl.(c): eighteen months after publication, 14 May 2027"
  source: {document: "Digital Personal Data Protection Act, 2023 (22 of 2023)", url: "https://indiacode.gov.in/server/api/core/bitstreams/52f9ecbb-b927-4ba6-ae6f-ca2fac50d4df/content"}
  verified: true

- id: DPDP-Act-8
  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 8"
  title: "General obligations of Data Fiduciary"
  excerpt: "(1) A Data Fiduciary shall, irrespective of any agreement to the contrary or failure of a Data Principal to carry out the duties provided under this Act, be responsible for complying with the provisions of this Act and the rules made thereunder in respect of any processing undertaken by it or on its behalf by a Data Processor."
