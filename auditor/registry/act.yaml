- id: DPDP-Act-8(11)
  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 8(11)"
  title: "Meaning of not approaching the Data Fiduciary"
  excerpt: "(11) For the purposes of this section, it is hereby clarified that a Data Principal shall be considered as not having approached the Data Fiduciary for the performance of the specified purpose, in any period during which she has not initiated contact with the Data Fiduciary for such performance, in person or by way of communication in electronic or physical form."
  parent: DPDP-Act-8
  penalty_parent: DPDP-Act-Schedule-7
  penalty_ceiling_inr_crore: 50
  enforceable_from: 2027-05-14
