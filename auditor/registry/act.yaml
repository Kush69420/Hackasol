- id: DPDP-Act-6(10)
  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 6(10)"
  title: "Burden of proof for consent"
  excerpt: "(10) Where a consent given by the Data Principal is the basis of processing of personal data and a question arises in this regard in a proceeding, the Data Fiduciary shall be obliged to prove that a notice was given by her to the Data Principal and consent was given by such Data Principal to the Data Fiduciary in accordance with the provisions of this Act and the rules made thereunder."
  parent: DPDP-Act-6
