  citation: "Section 23(3)"
  title: "Senior-most Member acts as Chairperson"
  excerpt: "(3) When the Chairperson is unable to discharge her functions owing to absence, illness or any other cause, the senior-most Member shall discharge the functions of the Chairperson until the date on which the Chairperson resumes her duties."
