  kind: dpdp-act
  citation: "Section 28(5)"
  title: "Inquiry into affairs of a person"
  excerpt: "(5) In case the Board determines that there are sufficient grounds to proceed with inquiry, it may, for reasons to be recorded in writing, inquire into the affairs of any person for ascertaining whether such person is complying with or has complied with the provisions of this Act."
