- id: DPDP-Act-6(3)
  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 6(3)"
  title: "Clear and plain request for consent"
  excerpt: "(3) Every request for consent under the provisions of this Act or the rules made thereunder shall be presented to the Data Principal in a clear and plain language, giving her the option to access such request in English or any language specified in the Eighth Schedule to the Constitution … authorised by the Data Fiduciary to respond to any communication from the Data Principal for the purpose of exercise of her rights under the provisions of this Act."
  parent: DPDP-Act-6
  penalty_parent: DPDP-Act-Schedule-7
  penalty_ceiling_inr_crore: 50
  enforceable_from: 2027-05-14
