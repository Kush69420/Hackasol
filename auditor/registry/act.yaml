  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 28(9)"
  title: "Assistance of police and officers"
  excerpt: "(9) The Board may require the services of any police officer or any officer of the Central Government or a State Government to assist it for the purposes of this section and it shall be the duty of every such officer to comply with such requisition."
