  citation: "Section 41"
  title: "Laying of rules and certain notifications"
  excerpt: "Every rule made and every notification issued under section 16 and section 42 of this Act shall be laid, as soon as may be after it is made, before each House of Parliament, while it is in session, for a total period of thirty days which may be comprised in one session or in two or more successive sessions, … so, however, that any such modification or annulment shall be without prejudice to the validity of anything previously done under that rule or notification."
