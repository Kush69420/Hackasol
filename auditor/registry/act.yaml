  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 6(2)"
  title: "Invalid part of consent"
  excerpt: "(2) Any part of consent referred in sub-section (1) which constitutes an infringement of the provisions of this Act or the rules made thereunder or any other law for the time being in force shall be invalid to the extent of such infringement."
  parent: DPDP-Act-6
  penalty_parent: DPDP-Act-Schedule-7
