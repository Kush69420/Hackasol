  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 5(3)"
  title: "Language of notice"
  excerpt: "(3) The Data Fiduciary shall give the Data Principal the option to access the contents of the notice referred to in sub-sections (1) and (2) in English or any language specified in the Eighth Schedule to the Constitution."
  parent: DPDP-Act-5
  penalty_parent: DPDP-Act-Schedule-7
  penalty_ceiling_inr_crore: 50
  enforceable_from: 2027-05-14
