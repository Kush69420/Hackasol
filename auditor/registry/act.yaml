  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 9(3)"
  title: "No tracking, behavioural monitoring or targeted advertising of children"
  excerpt: "(3) A Data Fiduciary shall not undertake tracking or behavioural monitoring of children or targeted advertising directed at children."
