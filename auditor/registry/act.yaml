- id: DPDP-Act-8(7)
  instrument: DPDP Act 2023
  kind: dpdp-act
  citation: "Section 8(7)"
  title: "Erasure of personal data"
  excerpt: "(7) A Data Fiduciary shall, unless retention is necessary for compliance with any law for the time being in force,— (a) erase personal data, upon the Data Principal withdrawing her consent or as soon as it is reasonable to assume that the specified purpose is no longer being served, whichever is earlier; and … (b) cause its Data Processor to erase any personal data that was made available by the Data Fiduciary for processing to such Data Processor."
  parent: DPDP-Act-8
  penalty_parent: DPDP-Act-Schedule-7
  penalty_ceiling_inr_crore: 50
  enforceable_from: 2027-05-14
  enforceable_basis: "G.S.R. 843(E) cl.(c): eighteen months after publication, 14 May 2027"
